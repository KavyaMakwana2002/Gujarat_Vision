services:
  - type: web
    name: sentinel-shield-backend
    env: python
    rootDir: server
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run_server.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
